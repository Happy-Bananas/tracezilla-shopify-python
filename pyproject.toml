[project]
name = "tracezilla-shopify-python"
version = "0.1.0"
description = "Framework-neutral Python templates for integrating Shopify with tracezilla"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx==0.28.1",
    "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.1",
]

[project.scripts]
compare-catalogs = "tracezilla_shopify.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracezilla_shopify"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tracezilla_shopify"]
mypy_path = "src"
